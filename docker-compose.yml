# Self-hosted (Coolify / any Docker host) deployment of all three surfaces (replaces vercel.json's services).
# Only `web` is exposed; it routes to `door` and `auth` on the internal network.
# Every secret arrives from the host environment (Coolify's env panel), never
# from a file in this repository.

services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - door
      - auth
    expose:
      - "80"

  door:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Auth is ON. Any value of KSOR_AUTH turns it off, and Coolify kept
    # injecting an old KSOR_AUTH=disabled-public from its env store even after
    # this file pinned it empty (found live 2026-10-08), so the door drops the
    # variable itself before ksor reads its environment.
    command: ["sh", "-c", "unset KSOR_AUTH; exec node_modules/.bin/ksor serve --instance instance.md"]
    environment:
      PORT: "80"
      KSOR_DB_URL: ${KSOR_DB_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # The door is an OAuth resource server that trusts the auth service below.
      KSOR_SSO_URL: ${KSOR_SSO_URL:-https://askseo.cybrumsolutions.dev/api/auth}
      KSOR_MCP_RESOURCE_URL: ${KSOR_MCP_RESOURCE_URL:-https://askseo.cybrumsolutions.dev/mcp}
      KSOR_JWT_ALLOWED_AUDIENCES: ${KSOR_JWT_ALLOWED_AUDIENCES:-https://askseo.cybrumsolutions.dev/mcp}
      KSOR_SNAPSHOT_KEYS: ${KSOR_SNAPSHOT_KEYS}
      KSOR_ALLOWED_HOSTS: ${KSOR_ALLOWED_HOSTS}

  auth:
    build:
      context: ./system/packages/auth-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "80"
      KSOR_DB_URL: ${KSOR_DB_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-AskSEO <askseo@cybrumsolutions.dev>}
      KSOR_MCP_RESOURCE_URL: ${KSOR_MCP_RESOURCE_URL:-https://askseo.cybrumsolutions.dev/mcp}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-ytpremiumahmedraza@gmail.com,hafizahmedraza12345@gmail.com}
