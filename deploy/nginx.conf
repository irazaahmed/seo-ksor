# The routing vercel.json used to declare, for a self-hosted deployment.
# TLS terminates at the platform proxy in front (Coolify's Traefik); this
# server speaks plain HTTP on :80 and forwards the original scheme.

map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS, re-resolved so a restarted container is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $door http://door:80;
  set $auth http://auth:80;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_set_header X-Forwarded-Host $host;

  # The MCP door. Streamable HTTP replies can be long-lived event streams.
  location /mcp {
    proxy_pass $door;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
  location /.well-known/oauth-protected-resource {
    proxy_pass $door;
  }
  location = /health { proxy_pass $door; }
  location = /ready  { proxy_pass $door; }

  # The account backend (Better Auth).
  location /api/auth/ {
    proxy_pass $auth;
  }

  # The static site. Next's export writes extensionless PNG metadata routes.
  location ~ ^/(icon|apple-icon|opengraph-image)$ {
    default_type image/png;
  }
  location ~ \.txt$ {
    charset utf-8;
    default_type text/plain;
  }
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  charset_types text/plain text/markdown application/json;
}
